<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jashn – AI-powered Celebration & Event Planner for weddings, birthdays, and community events. Smart budgets, timelines, vendor management, and personalized ideas.">
  <title>Jashn – AI Celebration & Event Planner</title>
  <link rel="stylesheet" href="/css/tokens.css?v=2">
  <link rel="stylesheet" href="/css/base.css?v=2">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <link rel="stylesheet" href="/css/print.css?v=2" media="print">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="app-header" role="banner">
    <div class="header-inner">
      <a href="#/" class="logo" aria-label="Jashn Home">
        <span class="logo-icon" aria-hidden="true">🎉</span>
        <span class="logo-text">Jashn</span>
      </a>
      <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>
      <div class="header-actions">
        <div class="event-switcher" id="event-switcher"></div>
        <button class="btn btn-icon theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-content" role="main">
    <div id="app" class="app-container">
      <!-- Views rendered here by router -->
    </div>
  </main>

  <footer class="app-footer" role="contentinfo">
    <p>Jashn – AI Celebration Planner &middot; Built for Google Virtual Prompt Wars &middot; <button class="btn-link" id="reset-demo-btn">Reset Demo Data</button></p>
  </footer>

  <!-- Toast container for notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden style="display: none;">
    <div class="spinner" aria-hidden="true"></div>
    <span>Loading...</span>
  </div>

  <script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
